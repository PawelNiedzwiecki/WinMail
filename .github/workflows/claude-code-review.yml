name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Workaround for anthropics/claude-code-action#2047 (tracked in #90). The action sets CLAUDE_CODE_ENTRYPOINT and
      # CLAUDE_CODE_ACTION for the CLI, and with them set the API refuses the credential: every run ends with is_error
      # and no model call. This runs the CLI through a wrapper that clears both. Remove once #2047 is fixed.
      - name: Install Claude Code without the action markers
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          cat > "$RUNNER_TEMP/claude" <<EOF
          #!/bin/sh
          unset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION
          exec "$HOME/.local/bin/claude" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/claude"
          "$RUNNER_TEMP/claude" --version

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model claude-sonnet-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

